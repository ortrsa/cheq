[project]
name = "telco-churn-mcp"
version = "0.1.0"
description = "MCP server for natural-language analytics over telco customer churn data"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "huggingface-hub>=0.26",
    "typer>=0.15",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
churn-mcp = "churn_mcp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
    "statsmodels>=0.15.0",
    "scipy-stubs>=1.18.1.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
